<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="930" viewBox="0 0 1440 930" font-family="'DejaVu Sans','Helvetica','Arial',sans-serif">
  <defs>
    <marker id="agray" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#94a3b8"/></marker>
    <marker id="agreen" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#16a34a"/></marker>
    <marker id="apurple" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#a855f7"/></marker>
  </defs>

  <rect x="0" y="0" width="1440" height="930" fill="#ffffff"/>

  <!-- Header -->
  <rect x="0" y="0" width="1440" height="72" fill="#1f2937"/>
  <rect x="0" y="72" width="1440" height="4" fill="#34a853"/>
  <text x="28" y="32" font-size="22" font-weight="bold" fill="#ffffff">Pocket Guitar Headphone Amp</text>
  <text x="28" y="56" font-size="13" fill="#cbd5e1">System block diagram &#183; rev A (work in progress) &#183; 9 V rail</text>
  <text x="1412" y="46" font-size="12" font-weight="bold" fill="#fbbf24" text-anchor="end">amber panel = still open</text>

  <!-- POWER section label -->
  <rect x="28" y="92" width="5" height="18" fill="#1e40af"/>
  <text x="44" y="107" font-size="13" font-weight="bold" fill="#1e40af">POWER &amp; CHARGING</text>

  <!-- Power cards (centers 131,361,591,821,1051,1281 ; w206 h88 y118) -->
  <rect x="28"  y="118" width="206" height="88" rx="11" fill="#e8f0fe" stroke="#5b8def" stroke-width="1.5"/>
  <text x="131" y="152" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">USB-C</text>
  <text x="131" y="176" font-size="11.5" fill="#334155" text-anchor="middle">CC 5.1k &#215;2 &#183; ESD</text>

  <rect x="258" y="118" width="206" height="88" rx="11" fill="#e8f0fe" stroke="#5b8def" stroke-width="1.5"/>
  <text x="361" y="152" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">BQ24074</text>
  <text x="361" y="176" font-size="11.5" fill="#334155" text-anchor="middle">power-path charger</text>

  <rect x="488" y="118" width="206" height="88" rx="11" fill="#e8f0fe" stroke="#5b8def" stroke-width="1.5"/>
  <text x="591" y="152" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Li-ion cell</text>
  <text x="591" y="176" font-size="11.5" fill="#334155" text-anchor="middle">protected &#183; 3.0&#8211;4.2 V</text>

  <rect x="718" y="118" width="206" height="88" rx="11" fill="#e8f0fe" stroke="#5b8def" stroke-width="1.5"/>
  <text x="821" y="152" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">SYS node</text>
  <text x="821" y="176" font-size="11.5" fill="#334155" text-anchor="middle">boost runs off SYS</text>

  <rect x="948" y="118" width="206" height="88" rx="11" fill="#e8f0fe" stroke="#5b8def" stroke-width="1.5"/>
  <text x="1051" y="152" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">TPS61379 &#8594; 9 V</text>
  <text x="1051" y="176" font-size="11.5" fill="#334155" text-anchor="middle">plain boost &#183; high Fsw</text>

  <rect x="1178" y="118" width="206" height="88" rx="11" fill="#e8f0fe" stroke="#5b8def" stroke-width="1.5"/>
  <text x="1281" y="152" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">TLE2426</text>
  <text x="1281" y="176" font-size="11.5" fill="#334155" text-anchor="middle">splitter &#183; +1&#181;F NR</text>

  <!-- power flow arrows -->
  <line x1="234"  y1="162" x2="256"  y2="162" stroke="#94a3b8" stroke-width="2" marker-end="url(#agray)"/>
  <line x1="464"  y1="162" x2="486"  y2="162" stroke="#94a3b8" stroke-width="2" marker-end="url(#agray)"/>
  <line x1="694"  y1="162" x2="716"  y2="162" stroke="#94a3b8" stroke-width="2" marker-end="url(#agray)"/>
  <line x1="924"  y1="162" x2="946"  y2="162" stroke="#94a3b8" stroke-width="2" marker-end="url(#agray)"/>
  <line x1="1154" y1="162" x2="1176" y2="162" stroke="#94a3b8" stroke-width="2" marker-end="url(#agray)"/>

  <!-- Rails -->
  <rect x="815" y="232" width="120" height="42" rx="10" fill="#f3e8fd" stroke="#a855f7" stroke-width="1.5"/>
  <text x="875" y="258" font-size="13" font-weight="bold" fill="#6b21a8" text-anchor="middle">+9 V</text>

  <rect x="950" y="232" width="180" height="42" rx="10" fill="#f3e8fd" stroke="#a855f7" stroke-width="1.5"/>
  <text x="1040" y="251" font-size="12.5" font-weight="bold" fill="#6b21a8" text-anchor="middle">virtual GND 4.5 V</text>
  <text x="1040" y="266" font-size="9.5" fill="#7c3aed" text-anchor="middle">signal reference</text>

  <rect x="1145" y="232" width="150" height="42" rx="10" fill="#f3e8fd" stroke="#a855f7" stroke-width="1.5"/>
  <text x="1220" y="251" font-size="12.5" font-weight="bold" fill="#6b21a8" text-anchor="middle">0 V (batt &#8722;)</text>
  <text x="1220" y="266" font-size="9.5" fill="#7c3aed" text-anchor="middle">HP return</text>

  <!-- rail source arrows -->
  <line x1="1020" y1="206" x2="905"  y2="230" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#apurple)"/>
  <line x1="1281" y1="206" x2="1055" y2="230" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#apurple)"/>
  <line x1="1300" y1="206" x2="1235" y2="230" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#apurple)"/>

  <!-- rail bus -->
  <line x1="110" y1="300" x2="1320" y2="300" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="1040" y1="274" x2="1040" y2="300" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="114" y="293" font-size="12" font-weight="bold" fill="#6b21a8">supply rails &#8594; every stage:   +9 V  &#183;  virtual 4.5 V  &#183;  0 V</text>

  <!-- SIGNAL section label -->
  <rect x="28" y="324" width="5" height="18" fill="#166534"/>
  <text x="44" y="339" font-size="13" font-weight="bold" fill="#166534">SIGNAL PATH</text>

  <!-- Signal cards (centers 131,361,591,821,1051,1281 ; w210 h130 y352) -->
  <rect x="26"  y="352" width="210" height="130" rx="13" fill="#e7f6ec" stroke="#34a853" stroke-width="1.6"/>
  <text x="131" y="388" font-size="15" font-weight="bold" fill="#166534" text-anchor="middle">1/4-in plug</text>
  <text x="131" y="412" font-size="12" fill="#334155" text-anchor="middle">into guitar jack</text>
  <text x="131" y="462" font-size="11" font-style="italic" fill="#15803d" text-anchor="middle">1 M&#8486; hi-Z input</text>

  <rect x="256" y="352" width="210" height="130" rx="13" fill="#e7f6ec" stroke="#34a853" stroke-width="1.6"/>
  <text x="361" y="386" font-size="15" font-weight="bold" fill="#166534" text-anchor="middle">OPA1678-A</text>
  <text x="361" y="410" font-size="12" font-weight="bold" fill="#166534" text-anchor="middle">DRIVE stage</text>
  <text x="361" y="432" font-size="11.5" fill="#334155" text-anchor="middle">hi-Z &#183; gain &#183; clip</text>
  <text x="361" y="451" font-size="11" fill="#b45309" text-anchor="middle">socketed diodes</text>
  <text x="361" y="470" font-size="11" font-style="italic" fill="#15803d" text-anchor="middle">ref: 4.5 V</text>

  <rect x="486" y="352" width="210" height="130" rx="13" fill="#e7f6ec" stroke="#34a853" stroke-width="1.6"/>
  <text x="591" y="386" font-size="15" font-weight="bold" fill="#166534" text-anchor="middle">OPA1678-B</text>
  <text x="591" y="410" font-size="12" font-weight="bold" fill="#166534" text-anchor="middle">recovery &#215;3</text>
  <text x="591" y="432" font-size="11.5" fill="#334155" text-anchor="middle">make-up gain</text>
  <text x="591" y="470" font-size="11" font-style="italic" fill="#15803d" text-anchor="middle">ref: 4.5 V</text>

  <rect x="716" y="352" width="210" height="130" rx="13" fill="#e7f6ec" stroke="#34a853" stroke-width="1.6"/>
  <text x="821" y="386" font-size="15" font-weight="bold" fill="#166534" text-anchor="middle">OPA1622 &#215;2</text>
  <text x="821" y="410" font-size="12" font-weight="bold" fill="#166534" text-anchor="middle">L / R buffers</text>
  <text x="821" y="432" font-size="11.5" fill="#334155" text-anchor="middle">unity &#183; bipolar</text>
  <text x="821" y="470" font-size="11" font-style="italic" fill="#15803d" text-anchor="middle">+9 V &#183; EN mute</text>

  <rect x="946" y="352" width="210" height="130" rx="13" fill="#e7f6ec" stroke="#34a853" stroke-width="1.6"/>
  <text x="1051" y="388" font-size="15" font-weight="bold" fill="#166534" text-anchor="middle">output caps</text>
  <text x="1051" y="412" font-size="12" fill="#334155" text-anchor="middle">220 &#181;F polymer</text>
  <text x="1051" y="462" font-size="11" font-style="italic" fill="#15803d" text-anchor="middle">ref: 0 V (batt &#8722;)</text>

  <rect x="1176" y="352" width="210" height="130" rx="13" fill="#e7f6ec" stroke="#34a853" stroke-width="1.6"/>
  <text x="1281" y="388" font-size="15" font-weight="bold" fill="#166534" text-anchor="middle">3.5 mm TRS</text>
  <text x="1281" y="412" font-size="12" fill="#334155" text-anchor="middle">headphones</text>
  <text x="1281" y="462" font-size="11" fill="#334155" text-anchor="middle">&#8594; 32 &#8486; (stereo)</text>

  <!-- signal flow arrows -->
  <line x1="236"  y1="417" x2="254"  y2="417" stroke="#16a34a" stroke-width="3" marker-end="url(#agreen)"/>
  <line x1="466"  y1="417" x2="484"  y2="417" stroke="#16a34a" stroke-width="3" marker-end="url(#agreen)"/>
  <line x1="696"  y1="417" x2="714"  y2="417" stroke="#16a34a" stroke-width="3" marker-end="url(#agreen)"/>
  <line x1="926"  y1="417" x2="944"  y2="417" stroke="#16a34a" stroke-width="3" marker-end="url(#agreen)"/>
  <line x1="1156" y1="417" x2="1174" y2="417" stroke="#16a34a" stroke-width="3" marker-end="url(#agreen)"/>
  <text x="245" y="407" font-size="10" font-weight="bold" fill="#16a34a" text-anchor="middle">signal</text>

  <!-- Still-open panel -->
  <rect x="28" y="508" width="838" height="344" rx="14" fill="#fffbeb" stroke="#f0b429" stroke-width="1.6"/>
  <text x="52" y="542" font-size="16" font-weight="bold" fill="#92600a">Still open &#8212; the fun part</text>
  <text x="56" y="578" font-size="13" fill="#78350f">&#8226;  Draw the output stage (OPA1622 L/R buffers) in KiCad</text>
  <text x="56" y="610" font-size="13" fill="#78350f">&#8226;  Charger config: ISET &#183; ILIM &#183; ITERM &#183; TS tie-off &#183; CE</text>
  <text x="56" y="642" font-size="13" fill="#78350f">&#8226;  Boost: raise L to 2.2&#8211;3.3 &#181;H &#183; decide FCCM vs PFM</text>
  <text x="56" y="674" font-size="13" fill="#78350f">&#8226;  Input soft-limiter (DNP option) at the drive input</text>
  <text x="56" y="706" font-size="13" fill="#78350f">&#8226;  Layout: boost hot loops tight, inductor away from front end</text>
  <text x="56" y="738" font-size="13" fill="#78350f">&#8226;  Power switch: SPST on boost EN = true-off for storage</text>
  <text x="56" y="792" font-size="12" font-style="italic" fill="#a16207">Drive-stage values are a Tube-Screamer-anchored starting point &#8212; meant to be tuned.</text>
  <text x="56" y="818" font-size="12" font-style="italic" fill="#a16207">Tone-critical parts (diodes, pots) are socketed for rev A.</text>

  <!-- Legend -->
  <rect x="888" y="508" width="524" height="150" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="912" y="540" font-size="15" font-weight="bold" fill="#334155">Legend</text>
  <rect x="912" y="558" width="18" height="18" rx="4" fill="#e8f0fe" stroke="#5b8def"/>
  <text x="940" y="572" font-size="13" fill="#334155">power / charging</text>
  <rect x="912" y="592" width="18" height="18" rx="4" fill="#e7f6ec" stroke="#34a853"/>
  <text x="940" y="606" font-size="13" fill="#334155">audio signal path</text>
  <rect x="912" y="626" width="18" height="18" rx="4" fill="#f3e8fd" stroke="#a855f7"/>
  <text x="940" y="640" font-size="13" fill="#334155">supply rails</text>
  <rect x="1160" y="558" width="18" height="18" rx="4" fill="#fffbeb" stroke="#f0b429"/>
  <text x="1188" y="572" font-size="13" fill="#334155">still open / to decide</text>

  <!-- Locked panel -->
  <rect x="888" y="674" width="524" height="178" rx="14" fill="#ecfdf5" stroke="#34a853" stroke-width="1.5"/>
  <text x="912" y="704" font-size="14" font-weight="bold" fill="#166534">Locked so far</text>
  <text x="912" y="730" font-size="11.5" fill="#14532d">&#8226; 9 V boost (no LDO) &#183; TLE2426 &#177;4.5 V ground</text>
  <text x="912" y="754" font-size="11.5" fill="#14532d">&#8226; FET input (OPA1678) + bipolar driver (OPA1622)</text>
  <text x="912" y="778" font-size="11.5" fill="#14532d">&#8226; power-path charger (BQ24074) &#8594; SYS &#8594; boost</text>
  <text x="912" y="802" font-size="11.5" fill="#14532d">&#8226; the gain stage is the buffer (no separate unity buffer)</text>
  <text x="912" y="826" font-size="11.5" fill="#14532d">&#8226; tone-critical parts socketed for rev A tuning</text>

  <!-- footer -->
  <text x="28" y="900" font-size="11.5" font-style="italic" fill="#64748b">FET input where impedance is high &#183; bipolar output where it&#8217;s low &#183; one 9 V rail with a synthesized 4.5 V ground.</text>
</svg>
