<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <marker id="arrGray" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrPurple" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#a855f7"/>
    </marker>
  </defs>

  <rect width="1440" height="900" fill="#ffffff"/>

  <!-- ===== Header ===== -->
  <rect x="0" y="0" width="1440" height="84" fill="#1f2937"/>
  <rect x="0" y="84" width="1440" height="5" fill="#34a853"/>
  <text x="40" y="40" font-size="27" font-weight="700" fill="#ffffff">Pocket Guitar Headphone Amp</text>
  <text x="40" y="68" font-size="14" fill="#cbd5e1">System block diagram &#183; rev A (work in progress)</text>
  <text x="1400" y="54" text-anchor="end" font-size="13" fill="#fbbf24" font-weight="600">amber &#63; = still open</text>

  <!-- ===== POWER SECTION LABEL ===== -->
  <rect x="40" y="110" width="5" height="20" rx="2" fill="#1e40af"/>
  <text x="56" y="126" font-size="14" font-weight="700" fill="#1e40af" letter-spacing="0.5">POWER &amp; CHARGING</text>

  <!-- Power cards (centers: 142 374 606 838 1070 1302 ; w=196 h=92 top=136) -->
  <!-- P1 -->
  <g filter="url(#shadow)"><rect x="44" y="136" width="196" height="92" rx="12" fill="#e8f0fe" stroke="#5b8def" stroke-width="1.5"/></g>
  <text x="142" y="172" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">USB-C</text>
  <text x="142" y="196" text-anchor="middle" font-size="11.5" fill="#334155">CC 5.1k &#215;2 &#183; ESD</text>
  <text x="142" y="213" text-anchor="middle" font-size="11.5" fill="#334155">charge in</text>

  <!-- P2 -->
  <g filter="url(#shadow)"><rect x="276" y="136" width="196" height="92" rx="12" fill="#e8f0fe" stroke="#5b8def" stroke-width="1.5"/></g>
  <text x="374" y="172" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Power-path charger</text>
  <text x="374" y="196" text-anchor="middle" font-size="11.5" fill="#334155">BQ2407x / MCP73871</text>
  <text x="374" y="213" text-anchor="middle" font-size="11.5" fill="#334155">class</text>
  <circle cx="456" cy="152" r="12" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
  <text x="456" y="157" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">?</text>

  <!-- P3 -->
  <g filter="url(#shadow)"><rect x="508" y="136" width="196" height="92" rx="12" fill="#e8f0fe" stroke="#5b8def" stroke-width="1.5"/></g>
  <text x="606" y="172" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Li-ion cell</text>
  <text x="606" y="196" text-anchor="middle" font-size="11.5" fill="#334155">protected &#183; single</text>
  <text x="606" y="213" text-anchor="middle" font-size="11.5" fill="#334155">3.0&#8211;4.2 V</text>

  <!-- P4 -->
  <g filter="url(#shadow)"><rect x="740" y="136" width="196" height="92" rx="12" fill="#e8f0fe" stroke="#5b8def" stroke-width="1.5"/></g>
  <text x="838" y="172" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">SYS node</text>
  <text x="838" y="196" text-anchor="middle" font-size="11.5" fill="#334155">boost runs off SYS,</text>
  <text x="838" y="213" text-anchor="middle" font-size="11.5" fill="#334155">not the battery</text>

  <!-- P5 -->
  <g filter="url(#shadow)"><rect x="972" y="136" width="196" height="92" rx="12" fill="#e8f0fe" stroke="#5b8def" stroke-width="1.5"/></g>
  <text x="1070" y="172" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Boost &#8594; 6 V</text>
  <text x="1070" y="196" text-anchor="middle" font-size="11.5" fill="#334155">plain boost &#183; high Fsw</text>
  <text x="1070" y="213" text-anchor="middle" font-size="11.5" fill="#334155">no LDO</text>
  <circle cx="1152" cy="152" r="12" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
  <text x="1152" y="157" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">?</text>

  <!-- P6 -->
  <g filter="url(#shadow)"><rect x="1204" y="136" width="196" height="92" rx="12" fill="#e8f0fe" stroke="#5b8def" stroke-width="1.5"/></g>
  <text x="1302" y="172" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">TLE2426</text>
  <text x="1302" y="196" text-anchor="middle" font-size="11.5" fill="#334155">rail splitter</text>
  <text x="1302" y="213" text-anchor="middle" font-size="11.5" fill="#334155">SOIC-8 + NR cap</text>

  <!-- power flow arrows -->
  <line x1="240" y1="182" x2="272" y2="182" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrGray)"/>
  <line x1="472" y1="182" x2="504" y2="182" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrGray)"/>
  <line x1="704" y1="182" x2="736" y2="182" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrGray)"/>
  <line x1="936" y1="182" x2="968" y2="182" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrGray)"/>
  <line x1="1168" y1="182" x2="1200" y2="182" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrGray)"/>

  <!-- Rails -->
  <g filter="url(#shadow)"><rect x="920" y="250" width="120" height="44" rx="10" fill="#f3e8fd" stroke="#a855f7" stroke-width="1.5"/></g>
  <text x="980" y="277" text-anchor="middle" font-size="13" font-weight="700" fill="#6b21a8">+6 V</text>
  <g filter="url(#shadow)"><rect x="1055" y="250" width="160" height="44" rx="10" fill="#f3e8fd" stroke="#a855f7" stroke-width="1.5"/></g>
  <text x="1135" y="271" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6b21a8">virtual GND 3 V</text>
  <text x="1135" y="286" text-anchor="middle" font-size="10" fill="#7c3aed">signal reference</text>
  <g filter="url(#shadow)"><rect x="1230" y="250" width="140" height="44" rx="10" fill="#f3e8fd" stroke="#a855f7" stroke-width="1.5"/></g>
  <text x="1300" y="271" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6b21a8">0 V (batt &#8722;)</text>
  <text x="1300" y="286" text-anchor="middle" font-size="10" fill="#7c3aed">HP return</text>

  <!-- rail source arrows -->
  <line x1="1050" y1="228" x2="1000" y2="248" stroke="#a855f7" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrPurple)"/>
  <line x1="1090" y1="228" x2="1300" y2="248" stroke="#a855f7" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrPurple)"/>
  <line x1="1302" y1="228" x2="1150" y2="248" stroke="#a855f7" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrPurple)"/>

  <!-- rail bus -->
  <line x1="120" y1="330" x2="1320" y2="330" stroke="#a855f7" stroke-width="1.6" stroke-dasharray="6 4"/>
  <line x1="1135" y1="294" x2="1135" y2="330" stroke="#a855f7" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="124" y="323" font-size="12" font-weight="600" fill="#6b21a8">supply rails &#8594; every stage:  +6 V  &#183;  virtual 3 V  &#183;  0 V</text>

  <!-- ===== SIGNAL SECTION LABEL ===== -->
  <rect x="40" y="352" width="5" height="20" rx="2" fill="#166534"/>
  <text x="56" y="368" font-size="14" font-weight="700" fill="#166534" letter-spacing="0.5">SIGNAL PATH</text>

  <!-- Signal cards (centers 140 372 604 836 1068 1300 ; w=200 h=140 top=382) -->
  <!-- S1 -->
  <g filter="url(#shadow)"><rect x="40" y="382" width="200" height="140" rx="14" fill="#e7f6ec" stroke="#34a853" stroke-width="1.6"/></g>
  <text x="140" y="420" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">6.35 mm jack</text>
  <text x="140" y="444" text-anchor="middle" font-size="12.5" fill="#334155">input (TRS)</text>
  <text x="140" y="466" text-anchor="middle" font-size="11.5" fill="#334155">&#8594; passive guitar</text>
  <text x="140" y="500" text-anchor="middle" font-size="11" font-style="italic" fill="#15803d">1 M&#8486; hi-Z input</text>

  <!-- S2 -->
  <g filter="url(#shadow)"><rect x="272" y="382" width="200" height="140" rx="14" fill="#e7f6ec" stroke="#34a853" stroke-width="1.6"/></g>
  <text x="372" y="420" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">OPA1678-A</text>
  <text x="372" y="444" text-anchor="middle" font-size="12.5" font-weight="600" fill="#166534">DRIVE stage</text>
  <text x="372" y="466" text-anchor="middle" font-size="11.5" fill="#334155">hi-Z in &#183; gain &#183; clip</text>
  <text x="372" y="486" text-anchor="middle" font-size="11" fill="#b45309">clip diodes socketed</text>
  <text x="372" y="504" text-anchor="middle" font-size="11" font-style="italic" fill="#15803d">ref: virtual 3 V</text>
  <circle cx="456" cy="398" r="12" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
  <text x="456" y="403" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">?</text>

  <!-- S3 -->
  <g filter="url(#shadow)"><rect x="504" y="382" width="200" height="140" rx="14" fill="#e7f6ec" stroke="#34a853" stroke-width="1.6"/></g>
  <text x="604" y="420" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">OPA1678-B</text>
  <text x="604" y="444" text-anchor="middle" font-size="12.5" font-weight="600" fill="#166534">volume / recovery</text>
  <text x="604" y="466" text-anchor="middle" font-size="11.5" fill="#334155">(2nd half of dual)</text>
  <text x="604" y="486" text-anchor="middle" font-size="11" fill="#b45309">needs make-up gain</text>
  <text x="604" y="504" text-anchor="middle" font-size="11" font-style="italic" fill="#15803d">ref: virtual 3 V</text>
  <circle cx="688" cy="398" r="12" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
  <text x="688" y="403" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">?</text>

  <!-- S4 -->
  <g filter="url(#shadow)"><rect x="736" y="382" width="200" height="140" rx="14" fill="#e7f6ec" stroke="#34a853" stroke-width="1.6"/></g>
  <text x="836" y="420" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">OPA1622</text>
  <text x="836" y="444" text-anchor="middle" font-size="12.5" font-weight="600" fill="#166534">output driver</text>
  <text x="836" y="466" text-anchor="middle" font-size="11.5" fill="#334155">bipolar &#183; low-Z</text>
  <text x="836" y="486" text-anchor="middle" font-size="11.5" fill="#334155">drives 32 &#8486;</text>
  <text x="836" y="504" text-anchor="middle" font-size="11" font-style="italic" fill="#15803d">+6 V &#183; pad&#8594;0 V &#183; EN</text>

  <!-- S5 -->
  <g filter="url(#shadow)"><rect x="968" y="382" width="200" height="140" rx="14" fill="#e7f6ec" stroke="#34a853" stroke-width="1.6"/></g>
  <text x="1068" y="420" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">Output cap</text>
  <text x="1068" y="444" text-anchor="middle" font-size="12.5" fill="#334155">220&#8211;470 &#181;F</text>
  <text x="1068" y="466" text-anchor="middle" font-size="11.5" fill="#334155">AC-couple to load</text>
  <text x="1068" y="504" text-anchor="middle" font-size="11" font-style="italic" fill="#15803d">ref: 0 V (batt &#8722;)</text>

  <!-- S6 -->
  <g filter="url(#shadow)"><rect x="1200" y="382" width="200" height="140" rx="14" fill="#e7f6ec" stroke="#34a853" stroke-width="1.6"/></g>
  <text x="1300" y="420" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">3.5 mm jack</text>
  <text x="1300" y="444" text-anchor="middle" font-size="12.5" fill="#334155">headphones</text>
  <text x="1300" y="466" text-anchor="middle" font-size="11.5" fill="#334155">&#8594; 32 &#8486; phones</text>

  <!-- signal flow arrows -->
  <line x1="240" y1="452" x2="270" y2="452" stroke="#16a34a" stroke-width="3" marker-end="url(#arrGreen)"/>
  <line x1="472" y1="452" x2="502" y2="452" stroke="#16a34a" stroke-width="3" marker-end="url(#arrGreen)"/>
  <line x1="704" y1="452" x2="734" y2="452" stroke="#16a34a" stroke-width="3" marker-end="url(#arrGreen)"/>
  <line x1="936" y1="452" x2="966" y2="452" stroke="#16a34a" stroke-width="3" marker-end="url(#arrGreen)"/>
  <line x1="1168" y1="452" x2="1198" y2="452" stroke="#16a34a" stroke-width="3" marker-end="url(#arrGreen)"/>
  <text x="255" y="442" text-anchor="middle" font-size="10" fill="#16a34a" font-weight="600">signal</text>

  <!-- ===== Open questions panel ===== -->
  <g filter="url(#shadow)"><rect x="40" y="548" width="840" height="300" rx="14" fill="#fffbeb" stroke="#f0b429" stroke-width="1.6"/></g>
  <circle cx="70" cy="578" r="12" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
  <text x="70" y="583" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">?</text>
  <text x="92" y="584" font-size="17" font-weight="700" fill="#92600a">Still open &#8212; the fun part</text>

  <text x="64" y="620" font-size="13" fill="#78350f">&#8226;  Charger part + charge current (power-path family; SYS-on-USB voltage)</text>
  <text x="64" y="648" font-size="13" fill="#78350f">&#8226;  Boost part + Fsw; input-current draw from a 3.0 V cell at peak load</text>
  <text x="64" y="676" font-size="13" fill="#78350f">&#8226;  Power on/off: TRS-ring vs toggle vs OPA1622 EN soft-power</text>
  <text x="64" y="704" font-size="13" fill="#78350f">&#8226;  Clip recipe: Si / Ge / LED, symmetric vs asymmetric  (socketed &#8594; tuned on the bench)</text>
  <text x="64" y="732" font-size="13" fill="#78350f">&#8226;  Volume / recovery topology + where the master volume sits</text>
  <text x="64" y="760" font-size="13" fill="#78350f">&#8226;  OPA1622 GND-pin reference + EN mute / turn-on-thump scheme</text>
  <text x="64" y="788" font-size="13" fill="#78350f">&#8226;  Reverse-polarity protection: likely delete  &#183;  low-battery indicator: TBD</text>
  <text x="64" y="822" font-size="12" font-style="italic" fill="#a16207">Drive-stage feedback values are a Tube-Screamer-anchored starting point &#8212; meant to be tuned, not copied.</text>

  <!-- ===== Legend ===== -->
  <g filter="url(#shadow)"><rect x="910" y="548" width="490" height="176" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/></g>
  <text x="934" y="580" font-size="15" font-weight="700" fill="#334155">Legend</text>
  <rect x="934" y="596" width="18" height="18" rx="4" fill="#e8f0fe" stroke="#5b8def"/>
  <text x="962" y="610" font-size="13" fill="#334155">power / charging</text>
  <rect x="934" y="626" width="18" height="18" rx="4" fill="#e7f6ec" stroke="#34a853"/>
  <text x="962" y="640" font-size="13" fill="#334155">audio signal path</text>
  <rect x="934" y="656" width="18" height="18" rx="4" fill="#f3e8fd" stroke="#a855f7"/>
  <text x="962" y="670" font-size="13" fill="#334155">supply rails</text>
  <circle cx="943" cy="695" r="10" fill="#f59e0b" stroke="#b45309"/>
  <text x="943" y="700" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">?</text>
  <text x="962" y="700" font-size="13" fill="#334155">still open / to decide</text>

  <!-- ===== Locked strip ===== -->
  <g filter="url(#shadow)"><rect x="910" y="740" width="490" height="108" rx="14" fill="#ecfdf5" stroke="#34a853" stroke-width="1.5"/></g>
  <text x="934" y="770" font-size="14" font-weight="700" fill="#166534">Locked so far</text>
  <text x="934" y="792" font-size="11.5" fill="#14532d">&#8226; LiPo &#8594; boost 6 V (no LDO) &#183; TLE2426 &#177;3 V ground</text>
  <text x="934" y="810" font-size="11.5" fill="#14532d">&#8226; FET input (OPA1678) + bipolar driver (OPA1622)</text>
  <text x="934" y="828" font-size="11.5" fill="#14532d">&#8226; the gain stage is the buffer (no separate unity buffer)</text>
  <text x="934" y="846" font-size="11.5" fill="#14532d">&#8226; tone-critical diodes socketed for rev A tuning</text>

  <!-- footer -->
  <text x="40" y="882" font-size="12" font-style="italic" fill="#64748b">FET input where impedance is high &#183; bipolar output where it&#8217;s low &#183; one 6 V rail with a synthesized 3 V ground.</text>
</svg>
